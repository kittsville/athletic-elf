{% extends "base.html" %}
{% block app_nav %}{% endblock %}
{% block title %}Hub and Department{% endblock %}
{% block content %}
  <h1>{{ config.APP_NAME }}</h1>
  <p>Please select your Hub and Department</p>
  <form class="hub-dept-form" method="post" action="{{ url_for('main.hub_department_form') }}">
    <label for="hub">Hub</label>
    <select id="hub" name="hub" required>
      <option value="" disabled selected>Select a hub</option>
      {% for h in hub_options %}
        <option value="{{ h }}">{{ h }}</option>
      {% endfor %}
    </select>
    <label for="department">Department</label>
    <select id="department" name="department" required>
      <option value="" disabled selected>Select a department</option>
      {% for d in department_options %}
        <option value="{{ d }}">{{ d }}</option>
      {% endfor %}
    </select>
    <div>
      <button type="submit">Submit</button>
    </div>
  </form>
  <section class="gdpr-stuff" aria-labelledby="gdpr-stuff-heading">
    <h2 id="gdpr-stuff-heading">GDPR Stuff</h2>
    {% include "_gdpr_data_notice.html" %}
  </section>
{% endblock %}
