<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Results</title>
  {% if config.APP_FAVICON %}
  <link rel="icon" type="image/png" sizes="32x32" href="{{ config.APP_FAVICON }}">
  {% endif %}
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 0.5rem 1rem; text-align: left; }
    th { background: #f5f5f5; }
    tr:nth-child(even) { background: #fafafa; }
  </style>
</head>
<body>
  <h1>Points by athlete</h1>
  <table>
    <thead><tr><th>First name</th><th>Last name</th><th>Athlete ID</th><th>Points</th></tr></thead>
    <tbody>
    {% for row in rows %}
      <tr>
        <td>{{ row.firstname or "—" }}</td>
        <td>{{ row.lastname or "—" }}</td>
        <td>{{ row.athlete_id }}</td>
        <td>{{ row.points }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</body>
</html>
